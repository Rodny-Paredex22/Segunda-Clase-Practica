<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion de Cursos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="contenedor">
        <h1>Inscripcion de Cursos</h1>
        <p class="subtitulo">
            Completa tus Datos Para el Registro
        </p>

        <form id="formulario"> <!-- Formulario de la Base de Datos -->
            
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Ingrese su Nombre" minlength="3" required>

            <label for="correo">Correo Electronico</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.com" required>

            <label for="edad">Edad</label>
            <input type="number" id="edad" min="16" max="100" required>

            <label for="curso">Seleccione un Curso</label>
            <select id="curso" required>
                <option value="">Seleccione.. </option>
                <option value="programacion-web">PROGRAMACION WEB</option>
                <option value="python-basico">PYTHON BASICO</option>
                <option value="servicio-restfull">SERVICIOV RETFULL .net</option>
            </select> <!-- FIN DEL SELECT CORRECTAMENTE CERRADO -->

            <!-- EL PÁRRAFO DEBE IR FUERA DEL SELECT -->
            <p id="detallecurso" class="detalle">
                Seleccione un Curso Para ver Su Duracion
            </p>

            <div class="botones">
                <button type="submit" class="btn-enviar"> Inscribirse </button>
                <button type="reset" class="btn-limpiar"> Limpiar </button>
            </div>

        </form>

        <div id="resultado" class="resultado oculto" aria-live="polite">
            <h2>Inscripcion Recibida</h2>
            <p id="mensajeresultado"></p>
        </div>
    </div>
</body>

</html>
